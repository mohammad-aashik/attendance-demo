<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3f210d">
<title>Sample Attendance Demo | Faculty of Engineering</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Arial, Helvetica, sans-serif;
    background: #fbf5df; color: #3f2818;
  }
  .topbar {
    background: #211810; color: #f8eee5; padding: 22px 20px 16px;
    box-shadow: 0 2px 5px #0003;
  }
  .topbar .site { font-size: 13px; opacity: .9; margin-top: 7px; }
  .topbar .heading { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { max-width: 680px; margin: 0 auto; padding: 18px 22px 36px; }
  .greeting { color: #776d60; font-size: 19px; margin: 0 0 8px; }
  h1 { font-size: 42px; font-weight: 500; margin: 0 0 42px; }
  .card {
    background: #fff; border: 1px solid #e4dac4; border-radius: 38px;
    padding: 34px 24px; text-align: center; box-shadow: 0 5px 18px #50351a0b;
  }
  .scan-icon {
    width: 112px; height: 112px; margin: 0 auto 24px; border-radius: 32px;
    background: #f7efcf; display: grid; place-items: center; font-size: 54px;
  }
  h2 { font-size: 30px; font-weight: 500; margin: 0 0 20px; }
  .description { color: #81796f; font-size: 18px; line-height: 1.55; margin: 0 auto 28px; max-width: 430px; }
  .fake-button {
    display: block; width: 100%; border-radius: 28px; padding: 20px 12px;
    background: #43230f; color: white; font-size: 20px; margin-top: 14px;
  }
  .fake-button.secondary { background: #fbf5df; border: 1px solid #e4dac4; color: #432b19; }
  .notice { margin-top: 24px; background: #f7efcf; border-radius: 30px; padding: 24px; color: #55402b; line-height: 1.5; }
  .profile { margin-top: 28px; background: #fff; border: 1px solid #e4dac4; border-radius: 30px; padding: 20px; text-align: center; }
  .profile img { display: block; width: 100%; max-width: 460px; height: auto; object-fit: cover; margin: 0 auto; border-radius: 18px; }
  .name { font-size: 30px; font-weight: 700; margin: 20px 0 8px; color: #3f2818; }
  .demo { text-align:center; color:#a13b32; font-size:13px; margin: 18px 0 0; }
  .bottom-nav { max-width:680px; margin: 0 auto; border-top:1px solid #e4dac4; display:flex; justify-content:space-around; padding:18px 8px; color:#847b6d; }
  .bottom-nav span { text-align:center; font-size:14px; }
  @media (max-width:420px) {
    main { padding: 34px 16px; }
    h1 { font-size: 38px; }
    .card { padding: 28px 18px; }
    h2 { font-size: 26px; }
  }
</style>
</head>
